name: Render Eres Showreel

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Render Remotion composition
        run: |
          mkdir -p out
          npx remotion render src/index.tsx EresShowreel out/eres-showreel.mp4 --codec=h264 --crf=16 --concurrency=4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: eres-showreel
          path: out/eres-showreel.mp4
